<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Ultra-smooth font rendering with soft bezier curves -->
  <match target="font">
    <edit mode="assign" name="antialias">
      <bool>true</bool>
    </edit>
    <edit mode="assign" name="hinting">
      <bool>false</bool>
    </edit>
    <edit mode="assign" name="hintstyle">
      <const>hintnone</const>
    </edit>
    <edit mode="assign" name="rgba">
      <const>rgb</const>
    </edit>
    <edit mode="assign" name="lcdfilter">
      <const>lcddefault</const>
    </edit>
  </match>

  <!-- Default Sans-Serif Font (Soft, Rounded, Eye-Friendly) -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Nunito</family>
      <family>Inter</family>
      <family>Roboto</family>
      <family>Adwaita Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Default Monospace Font (Rounded Terminals) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>CaskaydiaCove Nerd Font</family>
      <family>FiraCode Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Math Font Fallback -->
  <alias>
    <family>math</family>
    <prefer>
      <family>KaTeX_Math</family>
      <family>KaTeX_Main</family>
      <family>KaTeX_AMS</family>
    </prefer>
  </alias>

  <!-- Default Emoji Font -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
